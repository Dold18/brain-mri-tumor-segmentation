[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-mri-tumor-segmentation"
version = "0.3.0"
description = "Research software for brain MRI whole-tumor-region segmentation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "nibabel>=5.2,<6",
  "torch>=2.3,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
viz = ["matplotlib>=3.8,<4"]
app = ["streamlit>=1.50,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["brain_mri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
